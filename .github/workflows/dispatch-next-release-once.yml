name: One-time next release dispatch

on:
  push:
    branches:
      - main
    paths:
      - ".release-next-version.trigger"

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Dispatch release packaging workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run release-pack.yml --ref main
