name: Build self-owned Java mods

on:
  pull_request:
    paths:
      - 'mods/dimensionworks-*/**'
      - '.github/workflows/build-java-mods.yml'
  push:
    branches: [main]
    paths:
      - 'mods/dimensionworks-*/**'
      - '.github/workflows/build-java-mods.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.module }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        module:
          - dimensionworks-cave-factory
          - dimensionworks-drop-lifetime
          - dimensionworks-ftbchunks-no-forceload
          - dimensionworks-localization
          - dimensionworks-maid-ae-crank
          - dimensionworks-mek-stress
          - dimensionworks-rpm-limit
          - dimensionworks-transfer
          - dimensionworks-version-gate
          - dimensionworks-wrench-compat
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: mods/${{ matrix.module }}/**/*.gradle*

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Build and test
        working-directory: mods/${{ matrix.module }}
        run: gradle build --no-daemon

      - name: Upload built JAR
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.module }}-jar
          path: mods/${{ matrix.module }}/build/libs/*.jar
          if-no-files-found: error
          retention-days: 14

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.module }}-${{ github.run_number }}
          path: mods/${{ matrix.module }}/build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
