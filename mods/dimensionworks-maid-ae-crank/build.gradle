plugins {
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'eclipse'
    id 'idea'
}

version = '0.1.0'
group = 'dev.szx.dimensionworks'
base.archivesName = 'dimensionworks_maid_ae_crank'
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: '1.20.1'
    copyIdeResources = true
}

repositories {
    maven { name = 'Modrinth'; url = 'https://api.modrinth.com/maven' }
    maven { name = 'AE2'; url = 'https://modmaven.dev' }
    mavenCentral()
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.4.16'
    compileOnly fg.deobf('maven.modrinth:ae2:15.4.10-forge')
    compileOnly fg.deobf('maven.modrinth:touhou-little-maid:1.5.3-forge+mc1.20.1')
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

jar {
    finalizedBy 'reobfJar'
}
